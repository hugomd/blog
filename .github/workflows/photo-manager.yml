name: Photo manager

on:
  pull_request:
    paths: ["photo-manager/**", ".github/workflows/photo-manager.yml"]
  push:
    branches: [develop]
    paths: ["photo-manager/**", ".github/workflows/photo-manager.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (does not deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for an explicitly requested publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test, build, and optionally publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: photo-manager
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ghcr.io/hugomd/blog-photo-manager:sha-${{ github.sha }}
          cache-from: type=gha,scope=photo-manager
          cache-to: type=gha,mode=max,scope=photo-manager
          provenance: true
          sbom: true
      - name: Record the immutable deployment image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deploy image ghcr.io/hugomd/blog-photo-manager@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
