name: Protected album access

on:
  pull_request:
    paths: ["photo-access/**", "functions/**", "static/_routes.json", ".github/workflows/photo-access.yml"]
  push:
    branches: [develop]
    paths: ["photo-access/**", "functions/**", "static/_routes.json", ".github/workflows/photo-access.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test photo-access/*.test.mjs
